name: JARVIS Monthly Frugality Audit

on:
  schedule:
    # 1:a i månaden 09:00 svensk tid = 07:00 UTC
    - cron: '0 7 1 * *'
  workflow_dispatch:

concurrency:
  group: jarvis-cron-monthly
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install PyYAML

      - name: Generate monthly audit report
        env:
          PYTHONPATH: src
          JARVIS_MEMORY_ACTOR: ${{ vars.JARVIS_MEMORY_ACTOR }}
          JARVIS_MEMORY_TENANT_ID: ${{ vars.JARVIS_MEMORY_TENANT_ID }}
          JARVIS_MEMORY_USER_ID: ${{ vars.JARVIS_MEMORY_USER_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_LOG_PAGE_ID: ${{ secrets.NOTION_LOG_PAGE_ID }}
        run: python -m jarvis.audit.monthly_report
        working-directory: .

  synthesize:
    needs: audit
    uses: ./.github/workflows/jarvis-cloud.yml
    with:
      task: 'Månatlig Frugality-rapport: (1) Total kostnad denna månad, (2) hur mycket Frugality sparade vs planerad kostnad, (3) topp-3 tier-fördelningar, (4) vilka prenumerationer (M365/Perplexity Pro/ChatGPT Go) skulle vara värda att säga upp baserat på faktisk användning, (5) rekommendation för nästa månads månadsbudget. Kvantifiera i kr.'
      tier: 'MED'
      notion_page_id: '3ca66d43-c107-813b-90f3-daf5b5a42333'
    secrets: inherit
