name: JARVIS Approval Center offline security gate

on:
  pull_request:
    paths:
      - 'src/jarvis/approval/gate.py'
      - 'tests/test_approval_rpc.py'
      - 'tests/test_atomic_approval_transport.py'
      - 'tests/test_supabase_auth.py'
      - 'docs/security/approval-center-rls-lockdown.review.sql'
      - '.github/workflows/jarvis-approval-security.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  approval-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated runner (no provider SDKs or real secrets)
        run: python -m pip install --disable-pip-version-check pytest==8.4.2
      - name: Verify backend-only atomic RPC, no-redirect receipts and API key constraints
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          JARVIS_NOTIFY: '0'
          DRY_RUN: '1'
        run: |
          python -m pytest -q tests/test_approval_rpc.py tests/test_atomic_approval_transport.py tests/test_supabase_auth.py
          python -m py_compile src/jarvis/approval/gate.py
