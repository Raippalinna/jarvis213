name: JARVIS Mission Engine offline gate

on:
  pull_request:
    paths:
      - 'src/jarvis/core/mission_engine.py'
      - 'tests/test_mission_engine.py'
      - 'scripts/mission_run_offline.py'
      - '.github/workflows/jarvis-mission-offline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-mission:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test runner only (no LLM API dependencies)
        run: python -m pip install --disable-pip-version-check pytest==8.4.2

      - name: Execute isolated mission and verify evidence gate
        env:
          JARVIS_NOTIFY: '0'
          DRY_RUN: '1'
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          python scripts/mission_run_offline.py --output mission-result.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('mission-result.json').read_text(encoding='utf-8'))
          assert data['passed'] is True
          assert data['mission']['status'] == 'verified'
          assert data['production_verified'] is False
          assert all(v['verified'] for v in data['mission']['steps'].values())
          PY

      - name: Preserve narrow result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-mission-offline
          path: mission-result.json
          if-no-files-found: ignore
          retention-days: 7
