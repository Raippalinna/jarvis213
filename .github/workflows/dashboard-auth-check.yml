name: Dashboard auth (nyckelfria tester)
on:
  pull_request:
    paths:
      - "supabase/functions/jarvis-dashboard-api/index.ts"
      - "apps/dashboard/src/api.ts"
      - "tests/test_dashboard_auth.mjs"
      - ".github/workflows/dashboard-auth-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auth-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Offline auth tests (synthetic credentials)
        run: node --test tests/test_dashboard_auth.mjs
