name: Supabase backend diagnostics

on:
  push:
    paths:
      - "src/jarvis/supabase_auth.py"
      - "src/jarvis/memory/**"
      - "src/jarvis/approval/gate.py"
      - "jarvis_cloud.py"
      - "tests/test_supabase_auth.py"
      - "tests/test_memory_connection_status.py"
      - "tests/test_supabase_preflight.py"
      - "tests/test_chat_writeback_verification.py"
      - ".github/workflows/memory-connection-diagnostics.yml"
  pull_request:
    paths:
      - "src/jarvis/supabase_auth.py"
      - "src/jarvis/memory/**"
      - "src/jarvis/approval/gate.py"
      - "jarvis_cloud.py"
      - "tests/test_supabase_auth.py"
      - "tests/test_memory_connection_status.py"
      - "tests/test_supabase_preflight.py"
      - "tests/test_chat_writeback_verification.py"
      - ".github/workflows/memory-connection-diagnostics.yml"
  workflow_dispatch:
    inputs:
      live_probe:
        description: "Read required tables using protected Actions secrets"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run full key-free test suite
        env:
          PYTHONPATH: src
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt pytest
          python -m pytest tests -q

  live-read-only-preflight:
    if: github.event_name == 'workflow_dispatch' && inputs.live_probe
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Probe protected backend credentials
        env:
          PYTHONPATH: src
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m jarvis.memory.preflight
