name: JARVIS Cloud API

on:
  workflow_dispatch:
    inputs:
      task:
        description: 'Task att köra'
        required: true
        default: 'Ge veckans ekosystem-briefing'
        type: string
      tier:
        description: 'Kostnadsdimmer: FREE, LOW, MED eller HIGH'
        required: false
        default: 'LOW'
        type: choice
        options: [FREE, LOW, MED, HIGH]
      notion_page_id:
        description: 'Notion page ID att posta resultat till (valfritt)'
        required: false
        type: string
  repository_dispatch:
    types: [jarvis-run]
  workflow_call:
    inputs:
      task:
        required: true
        type: string
      tier:
        required: false
        type: string
        default: 'LOW'
      notion_page_id:
        required: false
        type: string

concurrency:
  group: jarvis-cloud
  cancel-in-progress: false

jobs:
  execute:
    # Fail closed: machine-triggered Comet dispatch stays disabled until explicitly enabled.
    if: ${{ github.event_name != 'repository_dispatch' || vars.JARVIS_REPOSITORY_DISPATCH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt

      - name: Resolve inputs safely
        id: inp
        env:
          JARVIS_EVENT_NAME: ${{ github.event_name }}
          JARVIS_PAYLOAD_TASK: ${{ github.event.client_payload.task }}
          JARVIS_PAYLOAD_TIER: ${{ github.event.client_payload.tier }}
          JARVIS_PAYLOAD_NOTION: ${{ github.event.client_payload.notion_page_id }}
          JARVIS_PAYLOAD_CHAT_ID: ${{ github.event.client_payload.chat_id }}
          JARVIS_PAYLOAD_ORIGIN: ${{ github.event.client_payload.origin }}
          JARVIS_PAYLOAD_REQUEST_ID: ${{ github.event.client_payload.request_id }}
          JARVIS_CALL_TASK: ${{ inputs.task }}
          JARVIS_CALL_TIER: ${{ inputs.tier }}
          JARVIS_CALL_NOTION: ${{ inputs.notion_page_id }}
          JARVIS_DISPATCH_TASK: ${{ github.event.inputs.task }}
          JARVIS_DISPATCH_TIER: ${{ github.event.inputs.tier }}
          JARVIS_DISPATCH_NOTION: ${{ github.event.inputs.notion_page_id }}
        run: python scripts/resolve_jarvis_inputs.py

      - name: Run JARVIS
        env:
          TASK: ${{ steps.inp.outputs.task }}
          JARVIS_TIER: ${{ steps.inp.outputs.tier }}
          NOTION_PAGE_ID: ${{ steps.inp.outputs.notion_page_id }}
          CHAT_ID: ${{ steps.inp.outputs.chat_id }}
          JARVIS_REQUEST_ID: ${{ steps.inp.outputs.request_id }}
          JARVIS_ORIGIN_CLAIM: ${{ steps.inp.outputs.origin_claim }}
          # --- Provider-nycklar (alla valfria; tomma = hoppa i chain) ---
          COMET_API_KEY: ${{ secrets.COMET_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
          # --- Minne (Supabase pgvector) ---
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # --- Notion Control Room ---
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_LOG_PAGE_ID: ${{ secrets.NOTION_LOG_PAGE_ID }}
          NOTION_DB_BESLUTSLOGG: ${{ secrets.NOTION_DB_BESLUTSLOGG }}
          NOTION_DB_INITIATIV: ${{ secrets.NOTION_DB_INITIATIV }}
          NOTION_DB_RADAR: ${{ secrets.NOTION_DB_RADAR }}
          # --- Slack-alerts ---
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_USER_ID: ${{ secrets.SLACK_USER_ID }}
        run: python jarvis_cloud.py

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-result-${{ github.run_id }}
          path: |
            result.json
            result.md
          if-no-files-found: warn
          retention-days: 30
