name: Foundation tests and read-only preflight
on:
  push:
    branches: ['fix/foundation-*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend-readonly:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read-only credential and backend preflight
        run: python scripts/backend_preflight.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          COMET_API_KEY: ${{ secrets.COMET_API_KEY }}
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest tests -q
        env:
          PYTHONPATH: src:.
          JARVIS_NOTIFY: '0'
