name: Pontura bridge security tests
on:
  pull_request:
    paths:
      - 'integrations/pontura/**'
      - '.github/workflows/pontura-bridge-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Contract and ingress tests (offline, no secrets)
        run: python -m unittest discover -s integrations/pontura -p 'test_*.py' -v
