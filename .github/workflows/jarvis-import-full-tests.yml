name: Jarvis full test av importrättning
on:
  push:
    branches: [fix/pytest-src-import-20261101]
    paths: ['.github/workflows/jarvis-import-full-tests.yml']
permissions:
  contents: read
concurrency:
  group: jarvis-import-full-tests
  cancel-in-progress: true
jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      JARVIS_NOTIFY: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: git rev-parse HEAD
      - run: python -m pip install -r requirements.txt pytest pytest-subtests pytest-socket
      - name: Hela Python-sviten utan PYTHONPATH och utan nätverk
        run: env -u PYTHONPATH python -m pytest tests -q --disable-socket --allow-unix-socket --junitxml=pytest-results.xml
      - name: Begränsad resultatrapport
        if: always()
        run: python scripts/ci_pytest_safe_report.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-safe-report
          path: pytest-safe-report.json
          if-no-files-found: warn
          retention-days: 7
  javascript-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.mjs
  dashboard-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm run build
