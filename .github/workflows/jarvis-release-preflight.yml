name: JARVIS manuell P0-releasekontroll (inga externa skrivningar)

# Medvetet bara manuellt: körs inte vid push/PR, utan kostnad för LLM eller externa API:er.
on:
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  release-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Offline regression (inga provider-anrop)
        run: python -m unittest discover -s tests -p test_release_blockers.py -v

      - name: Kontrollera kritiska GitHub-ärenden (read-only)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/check_release_blockers.py

      - name: Redovisa gräns för testet
        if: always()
        run: echo 'Detta är endast en ärendekontroll. Inga merges, deploys, migrations eller verkliga backendflöden har testats.'
