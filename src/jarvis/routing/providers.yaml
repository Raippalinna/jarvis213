    base_url: "https://api.z.ai/api/paas/v4"
    api_key_env: "ZAI_API_KEY"
    cost_per_1k_input_sek: 0.0            # GLM-4.7-Flash: input/output/cache gratis (docs.z.ai/guides/overview/pricing)
    cost_per_1k_output_sek: 0.0
    rate_limit_rpm: 30
    latency_p50_ms: 1200
    trains_on_data: false
    models:
      - id: "glm-4.7-flash"
        class: "free"
        quality_index: 0.72

  deepseek:
    display_name: "DeepSeek (off-peak 50 %)"
    base_url: "https://api.deepseek.com"
    api_key_env: "DEEPSEEK_API_KEY"
    cost_per_1k_input_sek: 0.00282     # V4.1 Flash peak $0.30/1M; off-peak $0.15 (api-docs.deepseek.com)
    cost_per_1k_output_sek: 0.01128    # peak $1.20/1M; off-peak $0.60
    rate_limit_rpm: 60
    latency_p50_ms: 2500
    trains_on_data: false
    models:
      - id: "deepseek-flash"             # DeepSeek-V4.1-Flash
        class: "mid-reasoning"
        quality_index: 0.84
      - id: "deepseek-v4-pro"            # $1.32/$3.96 peak, $0.66/$1.98 off-peak
