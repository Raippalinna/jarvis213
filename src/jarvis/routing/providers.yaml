    base_url: "https://api.z.ai/api/paas/v4"
    api_key_env: "ZAI_API_KEY"
    cost_per_1k_input_sek: 0.01316        # $1.40/1M
    cost_per_1k_output_sek: 0.04136       # $4.40/1M
    rate_limit_rpm: 60
    latency_p50_ms: 3500
    trains_on_data: false
