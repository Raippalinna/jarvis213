# JARVIS providers.yaml — leverantörs- och modellkatalog.
#
# Redigeras av Frugality-agentens veckovisa audit (frugality/audit.py).
# Struktur: varje entry beskriver en API-tillgänglig kanal Jarvis kan anropa
# direkt. Manuella kanaler (M365 Copilot, ChatGPT Go) hanteras separat i
# handoff.yaml eftersom de kräver att Ricky agerar själv i UI.

version: 3
updated_at: "2026-09-26"

# ---------------------------------------------------------------------------
# API-tillgängliga leverantörer (kan anropas autonomt)
# ---------------------------------------------------------------------------
providers:

  groq:
    display_name: "Groq (gratis)"
    base_url: "https://api.groq.com/openai/v1"
    api_key_env: "GROQ_API_KEY"
    cost_per_1k_input_sek: 0.0
    cost_per_1k_output_sek: 0.0
    rate_limit_rpm: 30
    latency_p50_ms: 250
    trains_on_data: true       # dolt läckagerisk
    models:
      - id: "openai/gpt-oss-120b"        # gratis: 30 RPM / 1 000 RPD / 8K TPM (console.groq.com/docs/rate-limits)
        class: "mid"
        quality_index: 0.74
      - id: "qwen/qwen3.8-27b"           # gratis: 30 RPM / 1 000 RPD
        class: "mid"
        quality_index: 0.72
      - id: "llama-3.3-70b-versatile"    # legacy, kan vara borttagen
        class: "mid"
        quality_index: 0.70

  cerebras:
    display_name: "Cerebras (gratis)"
    base_url: "https://api.cerebras.ai/v1"
    api_key_env: "CEREBRAS_API_KEY"
    cost_per_1k_input_sek: 0.0
    cost_per_1k_output_sek: 0.0
    rate_limit_rpm: 30
    latency_p50_ms: 120
    trains_on_data: false
    models:
      - id: "llama-3.3-70b"
        class: "mid"
        quality_index: 0.78

  google_ai:
    display_name: "Google AI Studio (gratis)"
    base_url: "https://generativelanguage.googleapis.com/v1beta/openai"
    api_key_env: "GOOGLE_AI_API_KEY"
    cost_per_1k_input_sek: 0.0
    cost_per_1k_output_sek: 0.0
    rate_limit_rpm: 15
    latency_p50_ms: 900
    trains_on_data: true          # gratisnivån används för produktförbättring (ai.google.dev pricing)
    models:
      - id: "gemini-3.8-flash"           # AI Studio gratis (Flash-nivå); betald $0.75/$3.75 t.o.m. 2026-12-31, dubblas 2027-01-01
        class: "mid"
        quality_index: 0.86
      - id: "gemini-3.1-flash-lite"      # AI Studio gratis; betald $0.25/$1.50
        class: "low"
        quality_index: 0.76
      - id: "gemini-2.5-flash"           # legacy
        class: "mid"
        quality_index: 0.80

  comet_low:
    display_name: "Comet (billig)"
    base_url: "https://api.cometapi.com/v1"
    api_key_env: "COMET_API_KEY"
    cost_per_1k_input_sek: 0.0015
    cost_per_1k_output_sek: 0.006
    rate_limit_rpm: 200
    latency_p50_ms: 1500
    trains_on_data: false
    models:
      - id: "gpt-4o-mini"
        class: "low"
        quality_index: 0.72

  comet_med:
    display_name: "Comet (mellan)"
    base_url: "https://api.cometapi.com/v1"
    api_key_env: "COMET_API_KEY"
    cost_per_1k_input_sek: 0.030
    cost_per_1k_output_sek: 0.150
    rate_limit_rpm: 100
    latency_p50_ms: 3500
    trains_on_data: false
    models:
      - id: "claude-3-5-sonnet-20241022"
        class: "med"
        quality_index: 0.91
      - id: "gpt-4o"
        class: "med"
        quality_index: 0.88

  comet_high:
    display_name: "Comet (premium)"
    base_url: "https://api.cometapi.com/v1"
    api_key_env: "COMET_API_KEY"
    cost_per_1k_input_sek: 0.150
    cost_per_1k_output_sek: 0.750
    rate_limit_rpm: 30
    latency_p50_ms: 8000
    trains_on_data: false
    models:
      - id: "claude-opus-4-20250514"
        class: "high"
        quality_index: 0.96
      - id: "o1-preview"
        class: "high-reasoning"
        quality_index: 0.95

  # --- v3 (2026-09-26): nya leverantörer, OpenAI-kompatibla endpoints. Hoppas över automatiskt
  #     när API-nyckeln saknas (TierRouter regel 1), så befintliga Comet-kedjor fungerar tills nycklar finns.
  #     Priser: leverantörernas prissidor 2026-09-26, USD/1M → SEK/1k med kurs 9,4 (antagande).
  zai:
    display_name: "Z.AI GLM"
    base_url: "https://api.z.ai/api/paas/v4"
    api_key_env: "ZAI_API_KEY"
    cost_per_1k_input_sek: 0.00141     # GLM-5.3-Flash $0.15/1M (docs.z.ai/guides/overview/pricing)
    cost_per_1k_output_sek: 0.0047    # $0.50/1M
    rate_limit_rpm: 60
    latency_p50_ms: 1200
    trains_on_data: false
    models:
      - id: "glm-5.3-flash"
        class: "mid"
        quality_index: 0.80

  zai_pro:
