    base_url: "https://openrouter.ai/api/v1"
    api_key_env: "OPENROUTER_API_KEY"
    cost_per_1k_input_sek: 0.0
    cost_per_1k_output_sek: 0.0
    rate_limit_rpm: 20                    # 20 RPM, 50 RPD (1 000 RPD efter $10 köp)
    latency_p50_ms: 3000
    trains_on_data: true                  # gratisrutter kan logga/träna – aldrig känslig data
    models:
      - id: "nvidia/nemotron-3-ultra:free"
        class: "free"
        quality_index: 0.72
      - id: "qwen/qwen3.8-27b:free"
        class: "free"
        quality_index: 0.70

  openai:
    display_name: "OpenAI direkt"
    base_url: "https://api.openai.com/v1"
    api_key_env: "OPENAI_API_KEY"
    cost_per_1k_input_sek: 0.0188     # GPT-6 Sol $2/$10 (developers.openai.com/api/docs/pricing)
    cost_per_1k_output_sek: 0.094
    rate_limit_rpm: 60
    latency_p50_ms: 4000
    trains_on_data: false
    models:
      - id: "gpt-6-luna"                 # $0.10/$0.50 – billig frontier-mini
        class: "low"
        quality_index: 0.80
      - id: "gpt-6-sol"
        class: "high"
        quality_index: 0.94

# ---------------------------------------------------------------------------
# Tier-mappning — kostnadsdimmern (FREE/LOW/MED/HIGH)
# Frugality-agenten läser detta för att välja billigaste ADEKVATA väg.
# Ordningen i chain = fallback-ordning vid fel/rate-limit.
# ---------------------------------------------------------------------------
tiers:

  FREE:
    quality_floor: 0.60
    max_cost_per_call_sek: 0.10
    sensitivity_max: "public"       # aldrig känslig data i FREE
    chain:
      - provider: zai_free
        model: "glm-4.7-flash"
      - provider: groq
        model: "openai/gpt-oss-120b"
      - provider: google_ai
        model: "gemini-3.8-flash"
      - provider: openrouter_free
        model: "nvidia/nemotron-3-ultra:free"
      - provider: cerebras
        model: "llama-3.3-70b"
      - provider: comet_low            # sista utväg om alla gratis 429
        model: "gpt-4o-mini"

  LOW:
    quality_floor: 0.75
    max_cost_per_call_sek: 1.00
    sensitivity_max: "internal"
    chain:
      - provider: zai
        model: "glm-5.3-flash"
      - provider: deepseek
        model: "deepseek-flash"
      - provider: openai
        model: "gpt-6-luna"
      - provider: google_ai
        model: "gemini-3.1-flash-lite"
      - provider: comet_low
        model: "gpt-4o-mini"

  MED:
    quality_floor: 0.85
    max_cost_per_call_sek: 10.00
    sensitivity_max: "confidential"
    chain:
      - provider: deepseek
        model: "deepseek-v4-pro"
      - provider: moonshot
        model: "kimi-k2.6"
      - provider: zai_pro
        model: "glm-5.3"
      - provider: google_ai
        model: "gemini-3.8-flash"
      - provider: openai
        model: "gpt-6-sol"
      # Comet-kedjan behålls som fallback (verifierad i drift 2026-09)
      - provider: comet_med
        model: "gpt-4o"
      - provider: comet_med
        model: "claude-3-5-sonnet-20241022"

  HIGH:
    quality_floor: 0.90
    max_cost_per_call_sek: 50.00
    sensitivity_max: "secret"
    chain:
      - provider: openai
        model: "gpt-6-sol"
      - provider: comet_high
        model: "claude-opus-4-20250514"
      - provider: comet_high
        model: "o1-preview"
      - provider: comet_med
        model: "gpt-4o"
# ---------------------------------------------------------------------------
# Månadsbudget (Frugality tvingar FREE när tröskel överskrids)
# ---------------------------------------------------------------------------
budget:
  monthly_cap_sek: 200
  soft_alert_pct: 50        # mjukt larm (Slack #titanos-health), HIGH kräver motivering
  hard_alert_pct: 75        # hårt larm: rutinjobb MED → LOW, modellråd pausas
  force_free_pct: 90        # circuit breaker: tvinga FREE (Frugality-veto i TierRouter)
  # FÖRBERETT, ej läst av kod ännu: när alla betalda nycklar ger 402/429 (krediter slut)
  # ska routern stanna i FREE-kedjan och posta ett larm i stället för att stoppa statuscheckar.
  credits_exhausted_mode: "FREE_ONLY"
